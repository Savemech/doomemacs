name: Windows installer

on:
  push:
    paths:
      - 'installer/**'
      - 'justfile'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'justfile'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned build tools
        run: |
          & ./installer/build/fetch-build-tools.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check maintenance policy and installer lifecycle
        run: |
          & ./installer/build/maintain.ps1 -Task test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
